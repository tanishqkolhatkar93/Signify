services:
  # 1. FastAPI Backend API Service
  - type: web
    name: signify-api
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.7
      - key: ENVIRONMENT
        value: production
      - key: PROVIDER_MODE
        value: verbx
      - key: VERBX_API_KEY
        sync: false
      - key: VERBX_API_BASE_URL
        value: https://api.verbxeco.com
      - key: CORS_ORIGINS
        value: "*"
      - key: JWT_SECRET
        generateValue: true

  # 2. React + Vite Frontend Static Site
  - type: static
    name: signify-frontend
    plan: free
    region: oregon
    buildCommand: npm --prefix frontend install && npm --prefix frontend run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: signify-api
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

